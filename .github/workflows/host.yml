---
# Host build, unit tests and static analysis of hf-core on Linux.
#
# The top-level CMakeLists.txt builds hf-core with HF_CORE_MCU=NONE and
# HF_CORE_RTOS=NONE (see docs/host-build.md). clang-tidy and cppcheck read the
# compile database of that build, so both see the real include paths and
# defines, and both analyse the same files: hf-core's own sources
# (handlers/, tests/host/), not the submodules (tools/lint/own_sources.py).
# Tool versions are the Ubuntu 24.04 packages, so a runner image update does
# not move the bar.
#
# "CI gate" is the single check to require on protected branches; a job that
# was skipped counts as passed.
name: Host CI

on:
  pull_request:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: host-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: Host build and tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure (host-debug)
        run: cmake --preset host-debug

      - name: Build
        run: cmake --build --preset host-debug

      - name: Test
        run: ctest --preset host-debug

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install host toolchain and clang-tidy 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy-18

      - name: Configure (compile database)
        run: cmake --preset host-debug

      - name: clang-tidy (hf-core sources)
        env:
          CLANG_TIDY: clang-tidy-18
        run: bash tools/lint/run-clang-tidy.sh build/host-debug

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          if-no-files-found: ignore
          retention-days: 14

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install host toolchain and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ cppcheck

      - name: Configure (compile database)
        run: cmake --preset host-debug

      - name: cppcheck (hf-core sources)
        run: bash tools/lint/run-cppcheck.sh build/host-debug

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - host
      - clang-tidy
      - cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Everything passed, or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          filter='[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key]'
          bad="$(jq -r "${filter} | join(\" \")" <<< "$RESULTS")"
          if [ -n "$bad" ]; then
            echo "::error::jobs that did not pass: $bad"
            exit 1
          fi
          echo "all jobs passed or were skipped"
