<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1038" viewBox="0 0 1200 1038" role="img" aria-labelledby="platform-layers-title platform-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="platform-layers-title">Where hf-core sits</title>
<desc id="platform-layers-desc">Layer diagram of the HardFOC platform. At the bottom, the MCU SDK and RTOS and the device driver repositories. Above them hf-core-drivers (drivers, interface wrap, pin config) and hf-core-utils (RTOS wrapper, general and CANopen utilities). On those, the hf-core handlers. Above the handlers, the board HALs, and at the top the products.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1037" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">PLATFORM</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">Where hf-core sits</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Handlers turn a device driver into a thread-safe object that takes Base* interfaces, so a board HAL wires chips to buses and</text>
<text x="32" y="141.5" font-size="18" fill="#566070">nothing above it sees the MCU.</text>
