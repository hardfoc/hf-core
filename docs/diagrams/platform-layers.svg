<text x="56" y="210.5" font-size="20" font-weight="700" fill="#17202C">Products</text>
<text x="56" y="241.2" font-size="17" fill="#2B3442">firmware on one board HAL: tasks, control loops, protocols</text>
<text x="56" y="339.5" font-size="20" font-weight="700" fill="#17202C">Board HALs: hf-hal-vortex-v1, hf-hal-flux-v1</text>
<text x="56" y="370.1" font-size="17" fill="#2B3442">create the MCU peripherals, construct the handlers, expose managers; pin maps from hf-pincfg</text>
